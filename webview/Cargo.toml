[package]
name = "lumen-reader-webview"
version = "0.2.6"
edition = "2021"
publish = false

[dependencies]
wry = "=0.57.1"
tao = "=0.37.2"
tiny_http = "=0.12.0"
zip = { version = "=9.2.2", default-features = false, features = ["deflate"] }
roxmltree = "=0.21.2"
ebook-rs = "=0.18.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
urlencoding = "=2.1.3"
reqwest = { version = "=0.12.28", default-features = false, features = ["blocking", "rustls-tls"] }

[target.'cfg(windows)'.build-dependencies]
winres = "=0.1.12"

[profile.release]
opt-level = 2
lto = "thin"
codegen-units = 4
strip = true
