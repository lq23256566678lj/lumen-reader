[package]
name = "lumen-reader"
version = "0.2.9"
edition = "2024"
rust-version = "1.95"
description = "Lumen Reader - a local-first, multi-format ebook reader built with egui"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
# GUI stack: egui 0.36 is the version shared by all three companion crates.
eframe = { version = "=0.36.2", default-features = false, features = ["glow"] }
egui = { version = "=0.36.2", default-features = false }
egui-async = { version = "=0.7.1", default-features = false, features = ["egui"] }
egui-file-dialog = { version = "=0.15.0", default-features = false }
modern-egui = "=0.2.3"

# Parsing.
ebook-rs = "=0.18.0"
pdfium-render = { version = "=0.9.5", features = ["thread_safe"] }
zip = { version = "=9.2.2", default-features = false, features = ["deflate"] }

# Serialization and platform paths.
base64 = "=0.23.1"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
dirs = "=6.0.0"

# Imaging.
image = { version = "=0.25.10", default-features = false, features = [
    "png",
    "jpeg",
    "gif",
    "webp",
    "bmp",
] }

# Cloud sync (async reqwest is driven by egui-async's Tokio runtime).
reqwest = { version = "=0.13.5", default-features = false, features = [
    "rustls",
    "json",
    "charset",
] }
tokio = { version = "=1.54.1", features = ["rt-multi-thread"] }
urlencoding = "=2.1.3"

# Errors and logging.
thiserror = "=2.0.21"
log = "=0.4.35"
env_logger = "=0.11.11"

[target.'cfg(windows)'.build-dependencies]
winres = "=0.1.12"

[profile.release]
opt-level = 2
lto = "thin"
codegen-units = 4
strip = true
